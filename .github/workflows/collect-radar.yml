name: Collect Radar GIFs

on:
  workflow_dispatch: # triggered externally by cron-job.org (and manual runs)

concurrency:
  group: collect-radar
  cancel-in-progress: false

env:
  # Bump this if the cache ever holds a full git history again.
  DATA_CACHE_KEY: wx-radar-data-snapshot-v1

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout wx-radar (collector code)
        uses: actions/checkout@v4

      - name: Restore wx-radar-data cache
        id: data-cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: ${{ env.DATA_CACHE_KEY }}
          restore-keys: |
            ${{ env.DATA_CACHE_KEY }}

      - name: Checkout wx-radar-data
        if: steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
          fetch-depth: 1

      - name: Sync wx-radar-data (cache hit)
        if: steps.data-cache.outputs.cache-hit == 'true'
        env:
          DATA_REPO: ${{ vars.DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          set -euo pipefail
          cd data
          git remote set-url origin "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git"
          git fetch --depth=1 origin main
          git checkout --force -B main origin/main
          git reset --hard origin/main
          git clean -fdx
          git sparse-checkout disable 2>/dev/null || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Run collector
        env:
          DATA_DIR: ${{ github.workspace }}/data
          DATA_REPO: ${{ vars.DATA_REPO }}
          DATA_BRANCH: main
          WEATHER_COM_API_KEY: ${{ secrets.WEATHER_COM_API_KEY }}
        run: npm run collect:radar

      - name: Publish 3-day snapshot (replace git history)
        working-directory: data
        env:
          DATA_REPO: ${{ vars.DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "wx-radar-bot"
          git config user.email "wx-radar-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git"
          git sparse-checkout disable 2>/dev/null || true

          # GIFs live in the worktree, so disk prune stages as real deletions.
          git add -A

          if git diff --staged --quiet; then
            echo "No changes to publish"
          else
            # One commit, no parents — old GIF blobs never accumulate on main.
            git checkout --orphan "snapshot-$(date -u +%Y%m%dT%H%M%SZ)"
            git add -A
            git commit -m "radar: $(date -u +%Y-%m-%dT%H:%MZ)"
            git branch -M main
            git push --force origin main
          fi

          git reflog expire --expire=now --all
          git gc --prune=now

      - name: Save wx-radar-data cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data
          key: ${{ env.DATA_CACHE_KEY }}
